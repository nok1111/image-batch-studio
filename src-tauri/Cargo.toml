[package]
name = "image-batch-studio"
description = "Professional local bulk image processing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "ibs_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ibs-core = { path = "../crates/ibs-core" }
ibs-store = { path = "../crates/ibs-store" }
ureq = { version = "3", default-features = false, features = ["json", "rustls", "platform-verifier"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
