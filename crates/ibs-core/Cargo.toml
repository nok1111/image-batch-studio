[package]
name = "ibs-core"
description = "Image Batch Studio processing engine (no UI dependencies)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
tempfile.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "ico", "avif"] }
webp = { version = "0.3", default-features = false }
rayon = "1.10"
walkdir = "2.5"
imageproc = "0.25"
ab_glyph = "0.2"
zenavif = "0.1.6"
zenpixels = "0.2"
dunce = "1.0.5"

[dev-dependencies]
serde_json.workspace = true
