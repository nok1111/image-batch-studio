[workspace]
resolver = "2"
members = ["src-tauri", "crates/ibs-core", "crates/ibs-store"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
ts-rs = "10"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
